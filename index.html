    <style>
      :root {
        --scrollbar-track: rgba(15, 23, 42, 0.5);
        --scrollbar-thumb: #475569;
      }

      /* Light Mode Overrides */
      .light {
        --scrollbar-track: rgba(226, 232, 240, 0.5);
        --scrollbar-thumb: #cbd5e1;
      }

      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        overflow: hidden; /* App handles scrolling */
        transition: background-color 0.5s ease;
      }
      pre, code {
        font-family: 'Fira Code', monospace;
      }

      /* Custom Scrollbar - Slim & Modern */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 99px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ea580c;
        border: 0;
        border-radius: 3px;
      }

      /* Text Selection Polish */
      ::selection {
        background: rgba(234, 88, 12, 0.3);
        color: inherit;
      }
      .light ::selection {
        background: rgba(234, 88, 12, 0.2);
        color: inherit;
      }

      /* Glassmorphism Utilities - Adaptive */
      .glass-panel {
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .light .glass-panel {
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
      }

      /* Markdown Content Styles */
      .markdown-content h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 2rem;
        transition: color 0.3s;
        letter-spacing: -0.02em;
      }
      .dark .markdown-content h1 {
        color: #fff;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        border-bottom: 1px solid rgba(234, 88, 12, 0.5);
      }
      .light .markdown-content h1 {
        color: #1e293b;
        border-bottom: 2px solid #ea580c;
      }

      .markdown-content h2 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-top: 2.5rem;
        margin-bottom: 1.25rem;
        border-left: 4px solid #ea580c;
        padding-left: 1rem;
        transition: color 0.3s;
        letter-spacing: -0.01em;
      }
      .dark .markdown-content h2 {
        color: #f1f5f9;
        background: linear-gradient(90deg, rgba(234, 88, 12, 0.1) 0%, transparent 100%);
      }
      .light .markdown-content h2 {
        color: #334155;
        background: linear-gradient(90deg, rgba(234, 88, 12, 0.05) 0%, transparent 100%);
      }

      .markdown-content h3 { font-size: 1.25rem; font-weight: 600; margin-top: 2rem; margin-bottom: 1rem; transition: color 0.3s; }
      .dark .markdown-content h3 { color: #e2e8f0; }
      .light .markdown-content h3 { color: #475569; }

      .markdown-content p { margin-bottom: 1.25rem; line-height: 1.8; font-size: 1.05rem; transition: color 0.3s; }
      .dark .markdown-content p { color: #cbd5e1; }
      .light .markdown-content p { color: #334155; }

      .markdown-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.5rem; transition: color 0.3s; }
      .dark .markdown-content ul { color: #cbd5e1; }
      .light .markdown-content ul { color: #334155; }

      .markdown-content li { margin-bottom: 0.5rem; }
      .markdown-content strong { color: #ea580c; font-weight: 600; }

      /* Inline Code */
      .markdown-content :not(pre) > code {
        padding: 0.2rem 0.4rem;
        border-radius: 0.375rem;
        font-size: 0.9em;
        transition: all 0.3s;
      }
      .dark .markdown-content :not(pre) > code {
        background-color: rgba(30, 41, 59, 0.8);
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.2);
        box-shadow: 0 0 5px rgba(56, 189, 248, 0.1);
      }
      .light .markdown-content :not(pre) > code {
        background-color: #f1f5f9;
        color: #0369a1;
        border: 1px solid #e2e8f0;
      }

      /* Code Blocks (Prism overrides) */
      .markdown-content pre {
        margin: 1.5rem 0 2rem 0 !important;
        border-radius: 0.75rem !important;
        backdrop-filter: blur(5px);
        transition: all 0.3s;
      }
      .dark .markdown-content pre {
        border: 1px solid rgba(148, 163, 184, 0.1) !important;
        background: rgba(2, 6, 23, 0.8) !important;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      }
      .light .markdown-content pre {
        border: 1px solid #e2e8f0 !important;
        background: #f8fafc !important;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      }

      /* Gem / Pro-Tip Block */
      .gem-block {
        position: relative;
        padding: 2rem;
        margin: 2.5rem 0;
        border-radius: 0.5rem;
        animation: pulse-border 4s infinite;
        transition: all 0.3s;
      }
      .dark .gem-block {
        background: rgba(69, 26, 3, 0.3);
        border: 1px solid #ea580c;
        box-shadow: 0 0 15px rgba(234, 88, 12, 0.2), inset 0 0 20px rgba(234, 88, 12, 0.1);
      }
      .light .gem-block {
        background: #fff7ed;
        border: 1px solid #fb923c;
        box-shadow: 0 4px 6px -1px rgba(234, 88, 12, 0.1);
      }

      @keyframes pulse-border {
        0% { border-color: #ea580c; }
        50% { border-color: #fdba74; }
        100% { border-color: #ea580c; }
      }

      .gem-icon {
        position: absolute;
        top: -16px;
        left: -16px;
        background: #ea580c;
        color: #fff;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        box-shadow: 0 0 10px #ea580c;
        font-size: 1.2rem;
        z-index: 10;
        transform: rotate(-10deg);
      }

      .gem-title {
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 0.75rem;
        margin-bottom: 0.75rem;
        display: block;
      }
      .dark .gem-title { color: #fdba74; text-shadow: 0 0 5px rgba(234, 88, 12, 0.8); }
      .light .gem-title { color: #c2410c; }

      .gem-block p {
        font-style: italic;
        margin-bottom: 0;
        font-size: 1rem;
      }
      .dark .gem-block p { color: #ffedd5; }
      .light .gem-block p { color: #431407; }

      /* Mermaid container customization */
      .mermaid-container {
        border-radius: 0.75rem;
        padding: 1.5rem;
        margin: 2rem 0;
        display: flex;
        justify-content: center;
        transition: all 0.3s;
      }
      .dark .mermaid-container {
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(148, 163, 184, 0.2);
        backdrop-filter: blur(5px);
      }
      .light .mermaid-container {
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
      }

    </style>
