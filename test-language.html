<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Detección de Idioma - Rust Learning Platform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .status {
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
        }
        .status h3 {
            margin-top: 0;
            font-size: 1.2em;
        }
        .value {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin: 5px 0;
        }
        .success { border-left: 4px solid #10b981; }
        .warning { border-left: 4px solid #f59e0b; }
        .info { border-left: 4px solid #3b82f6; }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        .test-result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
        }
        .pass { color: #10b981; font-weight: bold; }
        .fail { color: #ef4444; font-weight: bold; }
        code {
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Test de Detección de Idioma</h1>
        <p>Esta página prueba la detección automática del idioma español en la plataforma.</p>

        <div id="results"></div>

        <button onclick="runTests()">🔄 Ejecutar Tests</button>
        <button onclick="clearStorage()">🗑️ Limpiar localStorage</button>
        <button onclick="location.reload()">♻️ Recargar Página</button>
        <button onclick="window.open('https://southwest-ai-labs.github.io/rust-patterns-visuals/', '_blank')">🚀 Ir a App</button>
    </div>

    <script>
        function detectLanguage() {
            const saved = localStorage.getItem('preferredLanguage');
            if (saved === 'en' || saved === 'es') return saved;

            const browserLang = navigator.language.toLowerCase();
            console.log('🌍 Browser language detected:', browserLang);

            if (browserLang.startsWith('es')) {
                console.log('✅ Spanish detected, setting language to ES');
                return 'es';
            }

            console.log('✅ Default language set to EN');
            return 'en';
        }

        function runTests() {
            const results = document.getElementById('results');
            let html = '';

            // Test 1: Navigator Language
            html += '<div class="status info">';
            html += '<h3>📌 Test 1: Configuración del Navegador</h3>';
            html += '<p><strong>navigator.language:</strong> <span class="value">' + navigator.language + '</span></p>';
            html += '<p><strong>navigator.languages:</strong> <span class="value">' + JSON.stringify(navigator.languages) + '</span></p>';
            html += '<p><strong>Timezone:</strong> <span class="value">' + Intl.DateTimeFormat().resolvedOptions().timeZone + '</span></p>';
            html += '</div>';

            // Test 2: localStorage
            html += '<div class="status info">';
            html += '<h3>💾 Test 2: localStorage</h3>';
            const stored = localStorage.getItem('preferredLanguage');
            html += '<p><strong>preferredLanguage:</strong> <span class="value">' + (stored || 'null') + '</span></p>';
            html += '<p><strong>rust_hub_lang (old):</strong> <span class="value">' + (localStorage.getItem('rust_hub_lang') || 'null') + '</span></p>';
            html += '</div>';

            // Test 3: Detección Automática
            const detected = detectLanguage();
            const isSpanish = detected === 'es';
            const browserIsSpanish = navigator.language.toLowerCase().startsWith('es');

            html += '<div class="status ' + (isSpanish && browserIsSpanish ? 'success' : 'warning') + '">';
            html += '<h3>🎯 Test 3: Detección Automática</h3>';
            html += '<p><strong>Idioma Detectado:</strong> <span class="value">' + detected + '</span></p>';
            html += '<p><strong>¿Navegador en español?:</strong> <span class="value">' + (browserIsSpanish ? 'Sí ✅' : 'No ❌') + '</span></p>';

            if (browserIsSpanish && isSpanish) {
                html += '<p class="pass">✅ PASS: Español detectado correctamente</p>';
            } else if (browserIsSpanish && !isSpanish) {
                html += '<p class="fail">❌ FAIL: Navegador en español pero app detectó: ' + detected + '</p>';
                html += '<p>💡 <strong>Solución:</strong> Limpiar localStorage y recargar</p>';
            } else {
                html += '<p class="warning">⚠️ Navegador no está en español (configuración del sistema)</p>';
            }
            html += '</div>';

            // Test 4: Verificación de Cambios
            html += '<div class="status info">';
            html += '<h3>🔍 Test 4: Código de Detección</h3>';
            html += '<p>El código actualizado usa:</p>';
            html += '<code>localStorage.getItem(\'preferredLanguage\')</code><br>';
            html += '<code>navigator.language.toLowerCase().startsWith(\'es\')</code>';
            html += '<p style="margin-top: 10px;"><strong>Antigua clave:</strong> <code>rust_hub_lang</code> (deprecada)</p>';
            html += '<p><strong>Nueva clave:</strong> <code>preferredLanguage</code> (actual)</p>';
            html += '</div>';

            // Test 5: Instrucciones
            html += '<div class="status success">';
            html += '<h3>📋 Test 5: Pasos para Verificar</h3>';
            html += '<ol>';
            html += '<li>Limpiar localStorage con el botón 🗑️</li>';
            html += '<li>Recargar esta página ♻️</li>';
            html += '<li>Verificar que detecte español automáticamente</li>';
            html += '<li>Ir a la App 🚀 y verificar que cargue en español</li>';
            html += '<li>Abrir DevTools (F12) y ver console.log para debug</li>';
            html += '</ol>';
            html += '</div>';

            results.innerHTML = html;
        }

        function clearStorage() {
            localStorage.removeItem('preferredLanguage');
            localStorage.removeItem('rust_hub_lang');
            alert('✅ localStorage limpiado. Recarga la página para ver la detección automática.');
        }

        // Run tests on load
        window.onload = runTests;
    </script>
</body>
</html>
