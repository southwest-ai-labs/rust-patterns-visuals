name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_OPTIONAL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Show Node & npm
        run: |
          node --version
          npm --version
      - name: Install dependencies (no optional)
        run: npm ci --omit=optional
      - name: Build
        run: npm run build
